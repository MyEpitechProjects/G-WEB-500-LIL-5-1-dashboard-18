services:
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # adapter-node suppose du HTTPS sans cette variable : les formulaires seraient refusés en HTTP.
      # À adapter si l'application est servie depuis une autre adresse.
      ORIGIN: ${ORIGIN:-http://localhost:8080}
      DATABASE_PATH: /data/dashboard.db
      # Clé de la Web API Steam (https://steamcommunity.com/dev/apikey), requise pour le widget d'actualités
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # Clé de l'API SNCF (https://numerique.sncf.com/), requise pour les widgets SNCF
      SNCF_API_KEY: ${SNCF_API_KEY:-}
      # false (défaut) : compte activé immédiatement, aucun lien généré ; true : lien de confirmation par email à l'inscription
      ACCOUNT_NEED_VERIFICATION: ${ACCOUNT_NEED_VERIFICATION:-false}
    volumes:
      - db-data:/data
volumes:
  db-data:
